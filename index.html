<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Fitness App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background-color: #111;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 400px;
            z-index: 10;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 16px;
            margin: 0 0 5px 0;
            color: #00ffcc;
            text-transform: uppercase;
        }
        p {
            margin: 0 0 12px 0;
            font-size: 11px;
            color: #aaa;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        button {
            background: #222;
            color: #fff;
            border: 2px solid #00ffcc;
            padding: 12px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            font-size: 12px;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            background: #00ffcc;
            color: #000;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #00ffcc;
            font-weight: bold;
            z-index: 5;
        }
    </style>
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="loading">Lade 3D Android-App...</div>
    <div id="canvas-container"></div>

    <div id="ui-container">
        <h1>Outfit wechseln</h1>
        <p>Mit dem Finger drehen & zoomen</p>
        <div class="btn-group">
            <button onclick="changeOutfitColor(0x3a3d40)">Anthrazit</button>
            <button onclick="changeOutfitColor(0xff4444)">Sport-Rot</button>
            <button onclick="changeOutfitColor(0xaec6cf)">Pastell-Blau</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x141419);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.2, 2.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Akkuschonend für Handys
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Touch-Steuerung für Android
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 1.2;
        controls.maxDistance = 4;
        controls.target.set(0, 1, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        let clothingMeshes = [];
        const loader = new THREE.GLTFLoader();

        loader.load(
            'https://githubusercontent.com', // Ein funktionierendes, sportliches Standard-Testmodell
            function (gltf) {
                const model = gltf.scene;
                model.scale.set(0.65, 0.65, 0.65);
                model.position.set(0, 0, 0);
                scene.add(model);

                document.getElementById('loading').style.display = 'none';

                model.traverse((child) => {
                    if (child.isMesh) {
                        clothingMeshes.push(child);
                    }
                });
                changeOutfitColor(0x3a3d40);
            },
            undefined,
            function (error) {
                document.getElementById('loading').innerText = 'Netzwerkfehler beim Laden.';
            }
        );

        function changeOutfitColor(hexColor) {
            clothingMeshes.forEach(mesh => {
                mesh.material = new THREE.MeshStandardMaterial({
                    color: hexColor,
                    roughness: 0.6,
                    skinning: true
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
